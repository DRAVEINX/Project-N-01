name: Mivoryntra prototype CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prototype-checks:
    name: Prototype checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run automated smoke tests
        run: npm test
      - name: Check JavaScript syntax
        run: node --check src/app.js && node --check src/brand-intro.js && node --check src/next-features.js && node --check src/appointment-rules.js && node --check src/vault-restore-validation.js && node --check src/secure-storage.js && node --check src/encrypted-vault.js && node --check src/routine-migration.js && node --check scripts/serve.mjs && node --check scripts/prepare-mobile.mjs && node --check scripts/configure-android-signing.mjs && node --check service-worker.js && node --check tests/smoke.test.mjs
      - name: Verify expected project files
        run: |
          test -f index.html
          test -f src/styles.css
          test -f src/app.js
          test -f src/brand-intro.js
          test -f src/next-features.js
          test -f src/appointment-rules.js
          test -f src/vault-restore-validation.js
          test -f src/secure-storage.js
          test -f src/encrypted-vault.js
          test -f src/routine-migration.js
          test -f service-worker.js
          test -f manifest.webmanifest
          test -f assets/app-icon.svg
          test -f offline.html
          test -f scripts/serve.mjs
          test -f scripts/prepare-mobile.mjs
          test -f scripts/configure-android-signing.mjs
          test -f capacitor.config.json
          test -f tests/smoke.test.mjs
          test -f README.md

      - name: Package installable web prototype
        run: |
          zip -q -r project-n-01-web-prototype.zip \
            index.html offline.html manifest.webmanifest service-worker.js src assets
          test -s project-n-01-web-prototype.zip
      - name: Upload web prototype package
        uses: actions/upload-artifact@v4
        with:
          name: project-n-01-web-prototype
          path: project-n-01-web-prototype.zip
          if-no-files-found: error
          retention-days: 30
