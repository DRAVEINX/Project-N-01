name: Project N-01 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prototype-checks:
    name: Prototype checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Node.js dependencies
        run: npm install --no-audit --no-fund
      - name: Run automated smoke tests
        run: npm test
      - name: Check JavaScript syntax
        run: node --check src/app.js && node --check src/life-suite.js && node --check src/platform-services.js && node --check src/native-notifications-entry.js && node --check desktop/main.cjs && node --check src/secure-storage.js && node --check src/encrypted-vault.js && node --check src/routine-migration.js && node --check scripts/serve.mjs && node --check scripts/prepare-mobile.mjs && node --check scripts/configure-android-signing.mjs && node --check scripts/configure-android-build-variants.mjs && node --check service-worker.js && node --check tests/smoke.test.mjs
      - name: Build offline mobile web assets and notification bridge
        run: npm run build:mobile
      - name: Verify bundled native notifications
        run: test -s www/src/native-notifications.bundle.js
      - name: Verify expected project files
        run: |
          test -f index.html
          test -f src/styles.css
          test -f src/app.js
          test -f src/life-suite.js
          test -f src/life-suite.css
          test -f src/secure-storage.js
          test -f src/encrypted-vault.js
          test -f src/routine-migration.js
          test -f service-worker.js
          test -f manifest.webmanifest
          test -f assets/app-icon.svg
          test -f offline.html
          test -f scripts/serve.mjs
          test -f scripts/prepare-mobile.mjs
          test -f scripts/configure-android-signing.mjs
          test -f scripts/configure-android-build-variants.mjs
          test -f .github/workflows/android.yml
          test -f capacitor.config.json
          node -e "JSON.parse(require('fs').readFileSync('desktop/package.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
          test -f tests/smoke.test.mjs
          test -f tests/life-suite.test.mjs
          test -f desktop/main.cjs
          test -f desktop/package.json
          test -f README.md

      - name: Package installable web prototype
        run: |
          zip -q -r project-n-01-web-prototype.zip \
            index.html offline.html manifest.webmanifest service-worker.js src assets
          test -s project-n-01-web-prototype.zip
      - name: Upload web prototype package
        uses: actions/upload-artifact@v4
        with:
          name: project-n-01-web-prototype
          path: project-n-01-web-prototype.zip
          if-no-files-found: error
          retention-days: 30
