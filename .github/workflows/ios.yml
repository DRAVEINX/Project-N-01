name: Project N-01 iOS archive

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "offline.html"
      - "manifest.webmanifest"
      - "service-worker.js"
      - "src/**"
      - "assets/**"
      - "scripts/prepare-mobile.mjs"
      - "scripts/build-native-notifications.mjs"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-unsigned-archive:
    name: Build unsigned iOS archive
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and test application
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build:mobile

      - name: Verify current web assets for iOS
        run: |
          test -s www/src/life-suite.js
          test -s www/src/styles.css
          grep -F 'project-n-01-prototype-v17' www/service-worker.js

      - name: Add and sync iOS platform
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Build unsigned iOS archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/Project-N-01.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Package archive for download
        run: ditto -c -k --sequesterRsrc --keepParent build/Project-N-01.xcarchive build/Project-N-01-iOS-unsigned-archive.zip

      - name: Upload unsigned iOS archive
        uses: actions/upload-artifact@v4
        with:
          name: project-n-01-ios-unsigned-archive
          path: build/Project-N-01-iOS-unsigned-archive.zip
          if-no-files-found: error
          retention-days: 30
