# NovaLife Android: push-triggered validation and manual workflow_dispatch release-candidate builds.
name: NovaLife Android build

on:
  push:
    branches: [main, "feature/professional-suite-priority-1", "feature/novalife-rebrand"]
    paths:
      - "index.html"
      - "offline.html"
      - "manifest.webmanifest"
      - "service-worker.js"
      - "src/**"
      - "assets/**"
      - "scripts/prepare-mobile.mjs"
      - "scripts/build-native-notifications.mjs"
      - "scripts/ensure-android-microphone-permission.mjs"
      - "scripts/configure-android-signing.mjs"
      - "scripts/configure-android-build-variants.mjs"
      - "docs/GOOGLE-PLAY-SUBMISSION-CHECKLIST.md"
      - "tests/life-suite.test.mjs"
      - "tests/smoke.test.mjs"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    name: Build Android test APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses and install required packages
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$sdk_root" ]; then
            echo "ANDROID_HOME or ANDROID_SDK_ROOT is not set on this runner."
            exit 1
          fi
          sdkmanager_path="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$sdkmanager_path" ]; then
            echo "Android sdkmanager was not found under $sdk_root/cmdline-tools."
            exit 1
          fi
          yes | "$sdkmanager_path" --licenses >/dev/null || true
          "$sdkmanager_path" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Run application regression tests
        run: npm test

      - name: Prepare web assets for the native shell
        run: npm run build:mobile

      - name: Generate the Android project
        run: npx cap add android

      - name: Enable Android microphone permission
        run: node scripts/ensure-android-microphone-permission.mjs

      - name: Synchronize the native project
        run: npx cap sync android

      - name: Configure separate phone and tablet variants
        run: node scripts/configure-android-build-variants.mjs

      - name: Verify generated phone and tablet variants
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'applicationIdSuffix ".phone"' android/app/build.gradle
          grep -F 'applicationIdSuffix ".tablet"' android/app/build.gradle
          grep -E 'targetSdkVersion 36|targetSdk 36' android/app/build.gradle
          test -s android/app/src/phone/res/values/strings.xml
          test -s android/app/src/tablet/res/values/strings.xml

      - name: Build phone and tablet debug APKs
        run: cd android && ./gradlew --no-daemon --stacktrace assemblePhoneDebug assembleTabletDebug

      - name: Upload phone test APK
        uses: actions/upload-artifact@v4
        with:
          name: novalife-phone-debug-apk
          path: android/app/build/outputs/apk/phone/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload tablet test APK
        uses: actions/upload-artifact@v4
        with:
          name: novalife-tablet-debug-apk
          path: android/app/build/outputs/apk/tablet/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Configure optional Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/configure-android-signing.mjs

      - name: Build phone and tablet release APKs and app bundles
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd android && ./gradlew --no-daemon --stacktrace assemblePhoneRelease bundlePhoneRelease assembleTabletRelease bundleTabletRelease

      - name: Upload phone release candidates
        uses: actions/upload-artifact@v4
        with:
          name: novalife-phone-release-candidate
          path: |
            android/app/build/outputs/apk/phone/release/*.apk
            android/app/build/outputs/bundle/phoneRelease/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload tablet release candidates
        uses: actions/upload-artifact@v4
        with:
          name: novalife-tablet-release-candidate
          path: |
            android/app/build/outputs/apk/tablet/release/*.apk
            android/app/build/outputs/bundle/tabletRelease/*.aab
          if-no-files-found: error
          retention-days: 30
